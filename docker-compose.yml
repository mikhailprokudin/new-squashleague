services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: squash_league
      MYSQL_ROOT_HOST: "%"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
      - ./back/schema.sql:/schema.sql:ro
      - ./back/docker/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    ports:
      - "3306:3306"

  api:
    build: ./back
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: squash_league
      DB_USER: root
      DB_PASSWORD: ""
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  front:
    build: ./front
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  db_data:
