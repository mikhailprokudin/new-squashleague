name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 25m
          script: |
            set -euo pipefail

            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              DEPLOY_PATH="/opt/new-league"
            fi

            REPO_URL="git@github.com:mikhailprokudin/new-squashleague.git"

            mkdir -p "$HOME/.ssh"
            chmod 700 "$HOME/.ssh"
            touch "$HOME/.ssh/known_hosts"
            ssh-keyscan -t ed25519,rsa github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null || true

            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "First deploy: cloning into $DEPLOY_PATH"
              sudo mkdir -p "$(dirname "$DEPLOY_PATH")"
              sudo chown "$USER:$USER" "$(dirname "$DEPLOY_PATH")"
              git clone "$REPO_URL" "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"
            git remote set-url origin "$REPO_URL"
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            if [ ! -f .env ]; then
              echo "ERROR: $DEPLOY_PATH/.env is missing."
              echo "Create it once on the server: cp .env.example .env && nano .env"
              exit 1
            fi

            docker compose -f docker-compose.prod.yml --env-file .env up --build -d --remove-orphans
            docker compose -f docker-compose.prod.yml --env-file .env ps

            echo "Deploy finished."
