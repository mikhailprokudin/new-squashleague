# Host nginx site for Squash League
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/squash-league
#   sudo ln -sf /etc/nginx/sites-available/squash-league /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace league.example.com with your domain.
# For HTTPS use certbot:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d league.example.com

upstream squash_front {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name league.example.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://squash_front;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
